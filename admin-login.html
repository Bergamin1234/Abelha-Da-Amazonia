<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo - Abelha da Amazônia</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 antialiased selection:bg-amber-500 selection:text-white">

    <div class="w-full max-w-md">
        
        <!-- Discreet Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
            
            <!-- Glow effect -->
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-amber-500 to-amber-700 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg shadow-amber-500/20">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-xl font-bold font-serif text-white tracking-tight">Painel Administrativo</h1>
                <p class="text-xs text-slate-400 mt-1">Gestão de Vendas, Catálogo e Estoque</p>
            </div>

            <!-- Error Notification -->
            <div id="login-error" class="hidden mb-6 p-3 rounded-xl bg-red-950/50 border border-red-800 text-red-300 text-xs flex items-center gap-2">
                <i class="fas fa-exclamation-circle text-red-400"></i>
                <span id="login-error-msg">Usuário ou senha inválidos.</span>
            </div>

            <!-- Login Form -->
            <form id="admin-login-form" class="space-y-4">
                
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Usuário</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" required value="admin"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-300">Senha de Acesso</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                            <i class="fas fa-key"></i>
                        </span>
                        <input type="password" id="password" required value="admin123"
                               class="w-full pl-10 pr-10 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition font-mono">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 text-xs focus:outline-none">
                            <i class="fas fa-eye" id="toggle-pwd-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Credentials Reminder / Helper -->
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/60 text-[11px] text-slate-400 flex items-start gap-2">
                    <i class="fas fa-info-circle text-amber-400 mt-0.5"></i>
                    <div>
                        <span>Credenciais padrão do sistema:</span>
                        <div class="font-mono text-slate-300 mt-0.5">Usuário: <strong class="text-amber-400">admin</strong> | Senha: <strong class="text-amber-400">admin123</strong></div>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-amber-500/20 transition flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <span>Acessar Painel</span>
                    <i class="fas fa-arrow-right text-[11px]"></i>
                </button>
            </form>

            <!-- Back to Store link -->
            <div class="text-center mt-6 pt-6 border-t border-slate-800">
                <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400 transition flex items-center justify-center gap-1.5">
                    <i class="fas fa-arrow-left text-[10px]"></i>
                    <span>Retornar para a Loja Virtual</span>
                </a>
            </div>

        </div>

        <div class="text-center mt-6 text-slate-500 text-[11px]">
            &copy; 2026 Abelha da Amazônia • Gestão Segura
        </div>

    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        // Se já autenticado, redireciona para admin.html
        Auth.redirectIfLoggedIn();

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('toggle-pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            const res = Auth.login(u, p);
            if (res.success) {
                window.location.href = 'admin.html';
            } else {
                const errBox = document.getElementById('login-error');
                const errMsg = document.getElementById('login-error-msg');
                errMsg.textContent = res.message;
                errBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
